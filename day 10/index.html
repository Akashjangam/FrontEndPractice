<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Travel Photo Gallery</h1>
        <p>Explore Beautiful Destinations Around the World</p>
    </header>

    <main>
        <section class="gallery">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600" alt="Mountains">
                <h3>Mountains</h3>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=600" alt="Forest">
                <h3>Forest</h3>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Beach">
                <h3>Beach</h3>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="River">
                <h3>River</h3>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=600" alt="City">
                <h3>City</h3>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Sunset">
                <h3>Sunset</h3>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Travel Gallery. All Rights Reserved.</p>
    </footer>

</body>

</html>
