<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clean HTML Document</title>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>

        <nav>
            <a href="#home">Home</a> |
            <a href="#about">About</a> |
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>

        <section id="home">
            <h2>Home Section</h2>
            <p>
                This page demonstrates a clean HTML document structure
                using semantic tags and proper indentation.
            </p>

            <img
                src="https://via.placeholder.com/300"
                alt="Sample placeholder image"
            />
        </section>

        <section id="about">
            <h2>About</h2>
            <p>
                Semantic HTML improves readability, accessibility,
                and SEO performance.
            </p>
        </section>

    </main>

    <footer id="contact">
        <p>Contact: example@email.com</p>
    </footer>

</body>
</html>
